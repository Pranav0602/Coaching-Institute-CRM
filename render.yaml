# Render Blueprint for Coaching Institute CRM — Backend only
# Frontend is on Vercel (institute_crm/frontend). This file provisions Render Postgres + Web Service.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: crm-postgres
    plan: starter
    databaseName: institute_crm
    user: pranav
    ipAllowList: [] # open to Render services only
    # Enable pgvector for RAG. Render Postgres supports CREATE EXTENSION vector.
    # After first deploy, run once via psql $DATABASE_URL:
    #   CREATE EXTENSION IF NOT EXISTS vector;
    #   CREATE EXTENSION IF NOT EXISTS pg_trgm;
    #   CREATE EXTENSION IF NOT EXISTS citext;

services:
  - type: web
    name: crm-backend
    runtime: python
    plan: starter
    region: singapore # closest to ap-south-1 for AWS; change as needed
    rootDir: institute_crm
    buildCommand: chmod +x build.sh && ./build.sh
    # 2 gthread workers x 4 threads: faster cold boot and far less RAM than
    # 4 prefork workers on a Starter instance, while still serving concurrent
    # warmup + login + API traffic.
    startCommand: gunicorn institute_crm.wsgi:application --bind 0.0.0.0:$PORT --worker-class gthread --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz/
    # Auto-deploy so backend optimisations actually reach production on push.
    # (Was `false`: pushes updated git but production kept serving old code.)
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DEBUG
        value: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: crm-postgres
          property: connectionString
      - key: DB_SSL_REQUIRE
        value: true
      # A managed database drops idle TLS connections; a request that lands on one gets
      # "SSL error: decryption failed or bad record mac" and a 500. Reused connections
      # are health-checked, TCP keepalives are on, and a dead connection is replaced
      # and the read retried once (institute_crm/postgresql_backend). All three are the
      # default; set this to false to turn the retry off while diagnosing a provider
      # incident. Writes are never replayed, so no setting here can duplicate a row.
      - key: DB_RETRY_ON_BROKEN_CONNECTION
        value: "true"
      - key: DB_CONN_HEALTH_CHECKS
        value: "true"
      - key: RAG_ENABLED
        value: false
      # Token revocation. When true, rotating a refresh token retires the one it
      # replaces. It requires the token_blacklist migrations, which build.sh applies and
      # which each worker re-checks at boot; crm.E004 (via `check --deploy`) and
      # /readyz both fail if they are missing, because without them every login would 500.
      # Set to false to drop the per-login OutstandingToken write entirely (sessions then
      # expire rather than being revoked) - also a valid way to recover without a migration.
      - key: JWT_BLACKLIST
        value: "true"
      - key: COGNITO_ENABLED
        value: false # Django JWT auth only; no Cognito/LocalStack container needed
      - key: SECURE_SSL_REDIRECT
        value: false  # Render terminates TLS at proxy; set true only if you handle X-Forwarded-Proto correctly
